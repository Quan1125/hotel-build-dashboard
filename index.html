<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>酒店筹建数据台</title>
  <style>:root {
  color-scheme: light;
  --ink: #15263c;
  --subtle: #526477;
  --border: #dce6eb;
  --canvas: #f2f6f8;
  --paper: #fff;
  --navy: #10253e;
  --teal: #076b60;
  --teal-dark: #07564c;
  --mint: #d9f2ea;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 16px;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: 1rem; }
body { margin: 0; background: var(--canvas); color: var(--ink); }
a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
button, input, select, a, [tabindex] { outline-offset: 3px; }
:focus-visible { outline: 2px solid #078376; }
[hidden] { display: none !important; }
h1, h2, h3, p, dl, dd { margin: 0; }
.container { width: min(100% - 80px, 1344px); margin-inline: auto; }
.sr-only, .skip-link:not(:focus) { clip-path: inset(50%); position: absolute; width: 1px; height: 1px; overflow: hidden; white-space: nowrap; }
.skip-link { position: fixed; z-index: 5; top: 8px; left: 12px; padding: 10px; border-radius: 6px; background: var(--paper); color: var(--teal); }

.topbar { background: var(--paper); border-bottom: 1px solid var(--border); }
.topbar-inner { min-height: 67px; display: flex; align-items: center; gap: 42px; }
.brand { display: inline-flex; align-items: center; gap: 11px; font-weight: 760; letter-spacing: .015em; white-space: nowrap; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: end; justify-content: center; gap: 3px; background: #0d6258; padding: 8px 7px; }
.brand-mark i { width: 4px; border-radius: 2px; background: #d6f7ed; height: 7px; }
.brand-mark i:nth-child(2) { height: 11px; }
.brand-mark i:nth-child(3) { height: 17px; }
.topbar nav { display: flex; align-self: stretch; gap: 26px; }
.topbar nav a { display: flex; align-items: center; position: relative; font-weight: 560; font-size: .875rem; color: var(--subtle); white-space: nowrap; }
.topbar nav a:hover, .topbar nav a[aria-current] { color: var(--teal-dark); }
.topbar nav a[aria-current]::after { content: ""; position: absolute; height: 2px; inset: auto 0 0; background: var(--teal); border-radius: 2px 2px 0 0; }
.topbar .button { margin-left: auto; }

.button { display: inline-flex; justify-content: center; align-items: center; gap: 8px; min-height: 40px; padding: 8px 14px; border: 1px solid transparent; border-radius: 8px; font-size: .875rem; font-weight: 640; background: transparent; color: var(--ink); white-space: nowrap; }
.button-outline { background: var(--paper); border-color: var(--border); }
.button-outline:hover:not(:disabled) { border-color: #88aaa9; background: #f5fbfa; }
.button-primary { background: var(--teal); color: #fff; }
.button-primary:hover:not(:disabled) { background: var(--teal-dark); }
.button:disabled { color: #657789; background: #f1f5f7; border-color: #e4ecef; }
.download-icon { position: relative; flex: none; width: 15px; height: 15px; border: 1.5px solid currentColor; border-top: 0; border-radius: 0 0 3px 3px; clip-path: polygon(0 55%, 22% 55%, 22% 0, 78% 0, 78% 55%, 100% 55%, 100% 100%, 0 100%); }
.download-icon::before { position: absolute; content: ""; width: 1.5px; height: 9px; background: currentColor; left: calc(50% - .75px); top: 0; }
.download-icon::after { position: absolute; content: ""; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; width: 6px; height: 6px; transform: rotate(45deg); left: calc(50% - 3px); top: 4px; }

.hero { position: relative; isolation: isolate; overflow: hidden; display: flex; justify-content: space-between; align-items: center; gap: 24px; margin-block: 24px 18px; padding: 32px 33px; min-height: 154px; border-radius: 15px; background: linear-gradient(108deg, #122941, #13364b 67%, #14564f); color: #fff; }
.hero::before, .hero::after { content: ""; position: absolute; z-index: -1; pointer-events: none; }
.hero::before { inset: 0 0 0 40%; background: repeating-linear-gradient(0deg, #b3eee714 0 1px, transparent 1px 23px), repeating-linear-gradient(90deg, #b3eee714 0 1px, transparent 1px 23px); mask-image: linear-gradient(90deg, transparent, black); }
.hero::after { width: 290px; height: 290px; right: 40px; top: -100px; border: 1px solid #b3eee731; border-radius: 50%; box-shadow: 0 0 0 30px #84beaf1a, 0 0 0 60px #84beaf15, 0 0 0 90px #84beaf0e; }
.hero h1 { font-size: clamp(1.85rem, 4.2vw, 2.5rem); letter-spacing: .025em; line-height: 1.2; font-weight: 760; }
.file-meta { flex: none; display: flex; align-items: center; gap: 11px; padding: 11px 16px; border: 1px solid #a5dfd653; border-radius: 10px; background: #173b45dd; color: #e8f7f4; }
.file-meta div { display: grid; gap: 2px; }
.file-meta span:not(.file-icon) { font-size: .78rem; color: #c1dad9; }
.file-meta strong { font-size: .875rem; font-weight: 650; }
.file-icon { position: relative; width: 17px; height: 22px; border: 1.5px solid #b7eae1; border-radius: 3px; }
.file-icon::after { content: ""; position: absolute; inset: 7px 3px auto; height: 1.5px; background: #b7eae1; box-shadow: 0 4px #b7eae1, 0 8px #b7eae1; }

.metric, .panel { border: 1px solid var(--border); border-radius: 13px; background: var(--paper); box-shadow: 0 1px 2px #20374908; }
.metric { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0; padding: 15px 18px 16px; }
.metric dt { display: flex; align-items: center; gap: 9px; font-size: .875rem; color: var(--subtle); font-weight: 600; }
.metric-mark { width: 25px; height: 25px; display: grid; place-items: center; border-radius: 7px; color: var(--teal-dark); background: #e5f4f0; font-size: .9rem; line-height: 1; }
.metric-context { font-weight: 400; }
.metric dd { display: flex; align-items: baseline; gap: 5px; font-size: clamp(1.4rem, 2.8vw, 1.95rem); letter-spacing: -.03em; font-variant-numeric: tabular-nums; font-weight: 750; }
.metric dd span { font-size: .825rem; color: var(--subtle); letter-spacing: 0; font-weight: 550; }

.overview-panels { display: grid; grid-template-columns: 1.22fr 1fr; gap: 14px; margin-top: 14px; }
.overview-panels .panel { padding: 16px 19px; }
.panel-heading { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.panel h2 { font-size: 1.075rem; font-weight: 730; line-height: 1.45; }
.quiet { font-size: .8rem; color: var(--subtle); white-space: nowrap; }
.panel-caption { font-size: .845rem; color: var(--subtle); line-height: 1.45; margin-top: 4px; }
.region-bars { display: grid; gap: 1px; margin-top: 9px; }
.region-bar { display: grid; grid-template-columns: 68px minmax(0, 1fr) 34px; align-items: center; column-gap: 10px; width: 100%; min-height: 27px; padding: 2px 5px; border: 0; border-radius: 6px; background: transparent; color: var(--ink); font-size: .85rem; text-align: left; }
.region-bar:hover, .region-bar[aria-pressed="true"] { background: #eaf6f3; }
.bar-track { height: 7px; border-radius: 7px; background: #eaf1f3; overflow: hidden; }
.bar-fill { display: block; height: 100%; border-radius: inherit; background: #3b9a8b; }
.region-bar:first-child .bar-fill { background: #076b60; }
.region-value { color: var(--teal-dark); font-weight: 720; text-align: right; font-variant-numeric: tabular-nums; }
.brand-count-panel { display: flex; flex-direction: column; }
.brand-count-values { margin-top: 8px; flex: 1; display: grid; align-content: center; }
.brand-count-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 9px; border-bottom: 1px solid #e8eef0; }
.brand-count-line dt { font-weight: 530; font-size: .875rem; }
.brand-count-line dd { font-weight: 750; font-size: 1.11rem; color: var(--navy); font-variant-numeric: tabular-nums; white-space: nowrap; }
.brand-count-line dd span { margin-left: 4px; font-size: .8rem; color: var(--subtle); font-weight: 500; }
.brand-count-line:last-child { margin-top: 5px; border: 0; border-radius: 7px; background: #eaf6f3; }
.brand-count-line:last-child dt, .brand-count-line:last-child dd { color: var(--teal-dark); font-weight: 750; }

.projects { margin-top: 18px; overflow: hidden; }
.projects-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 17px 19px 14px; }
.projects-heading h2 { font-size: 1.2rem; }
.filters { display: grid; grid-template-columns: minmax(210px, 1.45fr) minmax(125px, .75fr) minmax(145px, .9fr) auto; gap: 10px; padding: 0 19px 14px; }
.search-field, .select-field { position: relative; min-width: 0; }
.search-field input, .select-field select { display: block; width: 100%; height: 40px; color: var(--ink); border: 1px solid var(--border); border-radius: 8px; background: #f8fafb; font-size: .875rem; }
.search-field input { padding: 0 10px 0 35px; }
.search-field input::placeholder { color: #66788a; }
.search-icon { position: absolute; top: 12px; left: 13px; width: 12px; height: 12px; border: 1.5px solid #607687; border-radius: 50%; pointer-events: none; }
.search-icon::after { content: ""; position: absolute; width: 6px; height: 1.5px; background: #607687; right: -5px; bottom: -2px; transform: rotate(48deg); }
.select-field select { appearance: none; padding: 0 30px 0 11px; text-overflow: ellipsis; }
.select-field::after { content: ""; position: absolute; width: 6px; height: 6px; border-right: 1.5px solid #607687; border-bottom: 1.5px solid #607687; transform: rotate(45deg); top: calc(50% - 5px); right: 12px; pointer-events: none; }
.reset { padding-inline: 10px; color: var(--teal-dark); }
.reset:hover:not(:disabled) { background: #eaf6f3; }
.reset:disabled { background: transparent; border-color: transparent; }
.table-navigation { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 19px 10px; color: var(--subtle); }
.table-navigation p { font-size: .825rem; }
.table-actions, .table-shift { display: flex; align-items: center; gap: 6px; }
.table-navigation .button { min-height: 33px; padding-block: 3px; }
.field-trigger { color: var(--teal-dark); border-color: #a9c9c3; }
.table-scroll { overflow: auto; max-height: min(64vh, 610px); border-block: 1px solid var(--border); }
.table-scroll:focus-visible { outline-offset: -2px; }
table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: .875rem; }
thead { text-align: left; }
th { position: sticky; top: 0; z-index: 2; border-bottom: 1px solid var(--border); font-weight: 680; padding: 0 11px; background: #edf3f6; min-width: 82px; }
th button { width: 100%; display: inline-flex; align-items: center; gap: 6px; border: 0; color: inherit; background: transparent; font-weight: inherit; text-align: inherit; padding: 12px 0; }
th button:hover { color: var(--teal-dark); }
th[aria-sort] button { color: var(--teal-dark); }
.column-label { white-space: pre-line; width: max-content; }
.sort-icon { width: 8px; color: #607888; font-size: .75rem; }
th[aria-sort] .sort-icon { color: var(--teal-dark); }
td { padding: 10px 11px; border-top: 1px solid #e7eef0; vertical-align: middle; }
tbody tr:first-child td { border-top: 0; }
th.column-a, td.column-a { position: sticky; left: 0; min-width: 135px; padding-left: 19px; box-shadow: 1px 0 var(--border); }
th.column-a { z-index: 3; }
td.column-a { z-index: 1; background: var(--paper); }
th:last-child, td:last-child { padding-right: 19px; }
tbody tr:hover, tbody tr:hover td.column-a { background: #f7fbfa; }
.cell-number { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.column-c, .column-e, .column-j, .column-k, .column-m { min-width: 110px; }
.column-d { min-width: 225px; max-width: 310px; line-height: 1.42; }
.column-i { width: 308px; min-width: 308px; max-width: 308px; }
.column-j, .column-k { white-space: nowrap; }
.column-q, .column-r { min-width: 125px; }
.hotel-button, .code-button, .progress-button { text-align: left; border: 0; padding: 3px 0; background: transparent; color: var(--ink); font-size: inherit; }
.hotel-button { font-weight: 650; overflow-wrap: anywhere; }
.code-button { color: var(--teal-dark); white-space: nowrap; font-variant-numeric: tabular-nums; }
.hotel-button:hover, .code-button:hover, .progress-button:hover .progress-link { text-decoration: underline; color: var(--teal-dark); }
.progress-button { display: block; max-width: 100%; }
.progress-preview { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; line-height: 1.45; max-height: 2.9em; }
.progress-link { display: block; margin-top: 3px; color: var(--teal-dark); font-size: .8125rem; font-weight: 640; }
.empty { text-align: center; padding: 34px 18px; color: var(--subtle); }
.table-footer { padding: 12px 19px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.page-size, .pagination { display: flex; align-items: center; gap: 8px; font-size: .875rem; color: var(--subtle); white-space: nowrap; }
.page-size select, .pagination .button { min-height: 35px; height: 35px; padding-block: 4px; }
.pagination { gap: 11px; }
#page-label { font-variant-numeric: tabular-nums; }
.footer { display: flex; justify-content: space-between; gap: 12px; padding: 17px 0 24px; color: var(--subtle); font-size: .8rem; line-height: 1.5; }

dialog { width: min(840px, calc(100% - 26px)); max-height: min(87dvh, 840px); padding: 0; border: 1px solid var(--border); border-radius: 15px; background: var(--paper); color: var(--ink); box-shadow: 0 20px 80px #10253e40; overflow: auto; overscroll-behavior: contain; }
dialog::backdrop { background: #10253e95; }
.field-dialog { width: min(650px, calc(100% - 26px)); }
.field-dialog-header { padding: 18px 20px 0; }
.field-dialog-header h2 { font-size: 1.225rem; line-height: 1.4; }
.field-chooser-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 20px; color: var(--subtle); font-size: .875rem; }
.field-chooser-toolbar div { display: flex; gap: 6px; }
.field-chooser-toolbar .button { min-height: 35px; padding-block: 4px; }
.field-options { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; border: 0; min-width: 0; margin: 0; padding: 0 20px 18px; }
.field-option { display: flex; align-items: center; gap: 7px; min-height: 43px; padding: 7px 9px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
.field-option:hover { border-color: #8ab2a7; }
.field-option:has(input:checked) { background: #edf7f4; border-color: #c3ddd7; }
.field-option input { width: 16px; height: 16px; flex: none; margin: 0; accent-color: var(--teal); }
.field-option span { white-space: pre-line; overflow-wrap: anywhere; font-size: .875rem; line-height: 1.3; }
.field-dialog-footer { display: flex; justify-content: flex-end; gap: 8px; position: sticky; bottom: 0; background: var(--paper); border-top: 1px solid var(--border); padding: 12px 20px; }
.detail-header { padding: 20px 23px; display: flex; justify-content: space-between; align-items: start; gap: 15px; position: sticky; top: 0; background: var(--navy); color: #fff; z-index: 1; }
.detail-header p, .detail-header span { color: #c5dbe3; font-size: .875rem; }
.detail-header h2 { margin-block: 5px; line-height: 1.35; font-size: 1.38rem; overflow-wrap: anywhere; }
.close-button { width: 37px; height: 37px; border: 1px solid #a6c7d26e; border-radius: 8px; color: #fff; font-size: 1.45rem; background: transparent; }
.close-button:hover { background: #ffffff22; }
.detail-body { padding: 4px 23px 23px; }
.detail-section { margin-top: 18px; }
.detail-section h3 { font-size: 1rem; margin-bottom: 8px; }
.detail-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
.detail-list div { padding: 9px 11px; border: 1px solid #edf2f4; min-width: 0; scroll-margin-top: 115px; }
.detail-list .wide { grid-column: 1 / -1; }
.detail-list dt { color: var(--subtle); font-size: .85rem; white-space: pre-line; }
.detail-list dd { font-size: .925rem; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }

@media (max-width: 900px) {
  .container { width: calc(100% - 40px); }
  .metric { padding-inline: 13px; }
  .filters { grid-template-columns: minmax(160px, 1.25fr) minmax(110px, .7fr) minmax(120px, .8fr) auto; }
}
@media (max-width: 660px) {
  .container { width: calc(100% - 26px); }
  .topbar-inner { min-height: 57px; gap: 9px; }
  .topbar nav { display: none; }
  .topbar .button { padding-inline: 9px; }
  .brand { font-size: .95rem; gap: 7px; }
  .brand-mark { width: 30px; height: 30px; padding-bottom: 6px; }
  .hero { padding: 19px; margin-block: 15px 13px; min-height: initial; display: grid; gap: 16px; }
  .file-meta { justify-self: start; padding: 7px 11px; }
  .metric { padding: 11px; }
  .metric dt { gap: 7px; font-size: .82rem; line-height: 1.3; }
  .metric-mark { display: none; }
  .overview-panels { grid-template-columns: 1fr; gap: 8px; margin-top: 8px; }
  .overview-panels .panel { padding: 13px; }
  .projects { margin-top: 13px; }
  .projects-heading { align-items: start; flex-wrap: wrap; padding-inline: 12px; }
  .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); padding-inline: 12px; gap: 7px; }
  .search-field { grid-column: 1 / -1; }
  .reset { justify-self: start; }
  .table-navigation { padding-inline: 12px; }
  .table-navigation .button { padding-inline: 7px; }
  .table-scroll { max-height: min(58vh, 480px); }
  .column-i { width: min(308px, calc(100vw - 30px)); min-width: min(308px, calc(100vw - 30px)); }
  .table-footer { padding-inline: 11px; flex-wrap: wrap; }
  .pagination { gap: 6px; }
  .pagination .button { padding-inline: 8px; }
  .footer { flex-direction: column; gap: 3px; }
  .detail-header, .detail-body { padding-inline: 12px; }
  .detail-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .field-options { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .field-dialog-header, .field-options, .field-chooser-toolbar, .field-dialog-footer { padding-inline: 12px; }
}
</style>
</head>
<body>
  <a class="skip-link" href="#projects">跳到项目明细</a>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="#overview"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>筹建数据台</a>
      <nav aria-label="页面导航"><a href="#overview" aria-current="location">数据概览</a><a href="#projects">项目明细</a></nav>
      <button class="button button-outline" id="export-xlsx" type="button"><span class="download-icon" aria-hidden="true"></span>下载全量 Excel</button>
    </div>
  </header>

  <main class="container" id="overview">
    <section class="hero" aria-labelledby="page-title">
      <h1 id="page-title">酒店筹建数据台</h1>
      <div class="file-meta"><span class="file-icon" aria-hidden="true"></span><div><span>数据来源</span><strong id="source-name"></strong></div></div>
    </section>

    <section class="overview" aria-label="全表统计">
      <div class="metrics" id="metrics"></div>
      <div class="overview-panels">
        <section class="panel region-panel" aria-labelledby="region-title">
          <div class="panel-heading"><h2 id="region-title">合区项目分布</h2><span id="region-count" class="quiet"></span></div>
          <p class="panel-caption" id="region-caption">项目数最多的 5 个合区，点击查看明细</p>
          <div class="region-bars" id="region-bars" aria-describedby="region-caption"></div>
        </section>
        <section class="panel brand-count-panel" id="brand-count-panel" aria-labelledby="brand-count-title">
          <div class="panel-heading"><h2 id="brand-count-title">品牌门店数</h2><span class="quiet">按品牌类型</span></div>
          <dl class="brand-count-values" id="brand-count-values"></dl>
        </section>
      </div>
    </section>

    <section class="panel projects" id="projects" aria-labelledby="projects-title">
      <div class="projects-heading">
        <div><h2 id="projects-title" tabindex="-1">项目明细</h2><p id="results" class="panel-caption" role="status" aria-live="polite"></p></div>
        <button class="button button-primary" type="button" id="export-csv"><span class="download-icon" aria-hidden="true"></span>导出当前结果 CSV</button>
      </div>
      <div class="filters" role="group" aria-label="筛选项目">
        <label class="search-field"><span class="search-icon" aria-hidden="true"></span><span class="sr-only">搜索酒店名称、拓建编码或店长</span><input type="search" id="search" placeholder="搜索酒店名称、拓建编码或店长" autocomplete="off"></label>
        <label class="select-field"><span class="sr-only">合区</span><select id="region"><option value="">全部合区</option></select></label>
        <label class="select-field"><span class="sr-only">品牌</span><select id="brand"><option value="">全部品牌</option></select></label>
        <button class="button reset" id="reset" type="button" disabled>重置筛选</button>
      </div>
      <div class="table-navigation">
        <p id="shown-field-count" role="status"></p>
        <div class="table-actions">
          <div class="table-shift" id="horizontal-controls"><button class="button button-outline" type="button" id="scroll-left" aria-controls="table-scroll" disabled>左移</button><button class="button button-outline" type="button" id="scroll-right" aria-controls="table-scroll">右移</button></div>
          <button class="button button-outline field-trigger" type="button" id="choose-fields" aria-haspopup="dialog" aria-controls="field-dialog">选择字段</button>
        </div>
      </div>

  <script>(() => {
  "use strict";

  const { source, sheet, columns, rows } = globalThis.WORKBOOK;
  const position = new Map(columns.map(({ key }, index) => [key, index]));
  const columnFor = key => columns[position.get(key)];
  const get = (row, key) => row[position.get(key)];
  const byId = id => document.getElementById(id);
  const integer = new Intl.NumberFormat("zh-CN", { maximumFractionDigits: 0 });
  const precise = new Intl.NumberFormat("zh-CN", { maximumFractionDigits: 12 });
  const amount = new Intl.NumberFormat("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const collator = new Intl.Collator("zh-CN", { numeric: true, sensitivity: "base" });
  const brandTypes = [
    { label: "聚力", type: "聚力品牌" },
    { label: "主力", type: "公共品牌" },
    { label: "自有", type: "自有品牌" },
  ];
  const brandTypeFilters = new Map(brandTypes.map(({ label, type }) => [`type:${label}`, type]));

  const tableColumns = columns.map(column => ({
    ...column,
    numeric: column.type === "number" || column.type === "money",
  }));
  let shownColumns = tableColumns;
  const detailGroups = [
    { label: "门店信息", start: 0, end: 7 },
    { label: "筹建进度", start: 7, end: 9 },
    { label: "开业与店长", start: 9, end: 13 },
    { label: "房量、设备与采购", start: 13, end: columns.length },
  ];
  const searchableColumns = ["A", "D", "L"];
  const search = byId("search");
  const region = byId("region");
  const brand = byId("brand");
  const reset = byId("reset");
  const details = byId("details");
  const csvButton = byId("export-csv");
  const tableBody = byId("table-body");
  const tableScroll = byId("table-scroll");
  const scrollLeft = byId("scroll-left");
  const scrollRight = byId("scroll-right");
  const horizontalControls = byId("horizontal-controls");
  const fieldDialog = byId("field-dialog");
  const fieldOptions = byId("field-options");
  const fieldApply = byId("fields-apply");
  const fieldInputs = [];
  const prev = byId("prev");
  const next = byId("next");
  const pageSize = byId("page-size");
  const normalized = value => String(value ?? "").normalize("NFKC").toLocaleLowerCase("zh-CN");
  const indexedRows = rows.map(row => ({ row, text: searchableColumns.map(key => normalized(get(row, key))).join("\n") }));
  const state = { page: 1, pageSize: Number(pageSize.value), sortKey: null, direction: 1, results: rows };
  const sortHeaders = [];

  function make(tag, className, content) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (content !== undefined) node.textContent = content;
    return node;
  }

  function numeric(value) {
    if (typeof value === "number") return Number.isFinite(value) ? value : null;
    if (typeof value === "string" && /^-?\d+(?:\.\d+)?$/.test(value.trim())) return Number(value);
    return null;
  }

  function formatValue(value, column, compact = false) {
    if (value === null || value === "") return "—";
    if (column.type === "number" && compact) {
      const number = numeric(value);
      return number === null ? String(value) : precise.format(number);
    }
    if (typeof value !== "number") return String(value);
    if (column.type === "money" && compact) return amount.format(value);
    return precise.format(value);
  }

  function counts(key) {
    const result = new Map();
    for (const row of rows) {
      const label = get(row, key);
      if (label == null || label === "") continue;
      result.set(label, (result.get(label) ?? 0) + 1);
    }
    return result;
  }

  function renderOverview() {
    const regionCounts = counts("B");
    const brandCounts = counts("E");
    const namedRegions = [...regionCounts].filter(([name]) => name !== "-");
    const card = make("dl", "metric");
    const label = make("dt");
    const icon = make("span", "metric-mark", "▦");
    icon.setAttribute("aria-hidden", "true");
    label.append(icon, "合计门店", make("span", "metric-context", "近 3 个月开业"));
    const number = make("dd", null, integer.format(rows.length));
    number.append(make("span", null, "家"));
    card.append(label, number);
    byId("metrics").append(card);

    byId("region-count").textContent = `${namedRegions.length} 个已填写合区`;
    const ranked = namedRegions.sort((a, b) => b[1] - a[1] || collator.compare(a[0], b[0])).slice(0, 5);
    for (const [label, count] of ranked) {
      const button = make("button", "region-bar");
      const track = make("span", "bar-track");
      const fill = make("span", "bar-fill");
      fill.style.width = `${count / ranked[0][1] * 100}%`;
      track.setAttribute("aria-hidden", "true");
      track.append(fill);
      button.type = "button";
      button.dataset.region = label;
      button.setAttribute("aria-pressed", "false");
      button.setAttribute("aria-label", `${label}，${count} 个项目`);
      button.append(make("span", null, label), track, make("span", "region-value", integer.format(count)));
      button.addEventListener("click", () => {
        region.value = region.value === label ? "" : label;
        updateFilters();
        byId("projects").scrollIntoView({ block: "start" });
        byId("projects-title").focus({ preventScroll: true });
      });
      byId("region-bars").append(button);
    }

    const countsByType = counts("F");
    const overviewCounts = brandTypes.map(({ label, type }) => ({ label, count: countsByType.get(type) ?? 0 }));
    const total = overviewCounts.reduce((sum, { count }) => sum + count, 0);
    overviewCounts.push({ label: "三类合计", count: total });
    for (const { label, count } of overviewCounts) {
      const line = make("div", "brand-count-line");
      const value = make("dd", null, integer.format(count));
      value.append(make("span", null, "家"));
      line.append(make("dt", null, label), value);
      byId("brand-count-values").append(line);
    }
    populateOptions(region, regionCounts.keys());
    populateBrandOptions(brandCounts.keys());
  }

  function populateOptions(select, values) {
    const names = [...values].sort((a, b) => collator.compare(a, b));
    for (const name of names) {
      const option = make("option", null, name === "-" ? "原表标为 -" : name);
      option.value = name;
      select.append(option);
    }
  }

  function populateBrandOptions(values) {
    const typeGroup = make("optgroup");
    typeGroup.label = "品牌类型";
    for (const { label } of brandTypes) {
      const option = make("option", null, label);
      option.value = `type:${label}`;
      typeGroup.append(option);
    }
    const nameGroup = make("optgroup");
    nameGroup.label = "品牌名称";
    populateOptions(nameGroup, values);
    brand.append(typeGroup, nameGroup);
  }

  function createTableHeader() {
    const header = make("tr");
    for (const column of tableColumns) {
      const th = make("th", `column-${column.key.toLowerCase()}`);
      const button = make("button");
      const icon = make("span", "sort-icon", "↕");
      th.scope = "col";
      button.type = "button";
      icon.setAttribute("aria-hidden", "true");
      button.append(make("span", "column-label", column.label), icon);
      button.addEventListener("click", () => {
        state.direction = state.sortKey === column.key ? -state.direction : 1;
        state.sortKey = column.key;
        updateFilters();
      });
      th.append(button);
      header.append(th);
      sortHeaders.push({ th, icon, key: column.key });
    }
    byId("table-head").append(header);
  }

  function updateFieldDraft() {
    const count = fieldInputs.filter(input => input.checked).length;
    byId("field-status").textContent = count ? `已选 ${count} / ${tableColumns.length} 列` : "请至少选择 1 个字段";
    fieldApply.disabled = count === 0;
  }

  function setAllFieldDrafts(checked) {
    for (const input of fieldInputs) input.checked = checked;
    updateFieldDraft();
  }

  function setupFieldChooser() {
    for (const { key, label } of tableColumns) {
      const option = make("label", "field-option");
      const input = make("input");
      input.type = "checkbox";
      input.value = key;
      input.checked = true;
      option.append(input, make("span", null, label));
      fieldOptions.append(option);
      fieldInputs.push(input);
    }
    byId("choose-fields").addEventListener("click", () => {
      const shownKeys = new Set(shownColumns.map(({ key }) => key));
      for (const input of fieldInputs) input.checked = shownKeys.has(input.value);
      updateFieldDraft();
      fieldDialog.showModal();
    });
    fieldOptions.addEventListener("change", updateFieldDraft);
    byId("fields-all").addEventListener("click", () => setAllFieldDrafts(true));
    byId("fields-clear").addEventListener("click", () => setAllFieldDrafts(false));
    byId("fields-cancel").addEventListener("click", () => fieldDialog.close());
    byId("field-form").addEventListener("submit", event => {
      event.preventDefault();
      const selectedKeys = new Set(fieldInputs.filter(input => input.checked).map(input => input.value));
      if (!selectedKeys.size) return;
      shownColumns = tableColumns.filter(({ key }) => selectedKeys.has(key));
      for (const { key, th } of sortHeaders) th.hidden = !selectedKeys.has(key);
      updateShownFieldCount();
      tableScroll.scrollLeft = 0;
      renderTable();
      fieldDialog.close();
    });
    updateShownFieldCount();
  }

  function updateShownFieldCount() {
    byId("shown-field-count").textContent = `显示 ${shownColumns.length} / ${tableColumns.length} 列`;
  }

  function compareRows(a, b, column) {
    const aValue = get(a, column.key);
    const bValue = get(b, column.key);
    const aMissing = aValue === null || aValue === "" || aValue === "-";
    const bMissing = bValue === null || bValue === "" || bValue === "-";
    if (aMissing || bMissing) return Number(aMissing) - Number(bMissing);
    if (column.numeric) {
      const left = numeric(aValue);
      const right = numeric(bValue);
      if (left !== null && right !== null) return (left - right) * state.direction;
    }
    return collator.compare(String(aValue), String(bValue)) * state.direction;
  }

  function updateFilters() {
    const words = normalized(search.value).trim().split(/\s+/).filter(Boolean);
    const selectedType = brandTypeFilters.get(brand.value);
    const brandColumn = selectedType ? "F" : "E";
    const brandFilter = selectedType ?? brand.value;
    state.results = indexedRows.filter(({ row, text }) => (
      (!region.value || get(row, "B") === region.value) &&
      (!brandFilter || get(row, brandColumn) === brandFilter) &&
      words.every(word => text.includes(word))
    )).map(({ row }) => row);
    if (state.sortKey) {
      const column = tableColumns.find(({ key }) => key === state.sortKey);
      state.results.sort((a, b) => compareRows(a, b, column));
    }
    const filtered = Boolean(words.length || region.value || brand.value);
    const count = integer.format(state.results.length);
    byId("results").textContent = filtered ? `符合条件 ${count} / ${integer.format(rows.length)} 家门店` : `共 ${count} 家门店 · ${columns.length} 个字段`;
    reset.disabled = !filtered;
    csvButton.disabled = !state.results.length;
    for (const bar of byId("region-bars").children) {
      bar.setAttribute("aria-pressed", String(bar.dataset.region === region.value));
    }
    for (const { th, icon, key } of sortHeaders) {
      if (key === state.sortKey) {
        th.setAttribute("aria-sort", state.direction === 1 ? "ascending" : "descending");
        icon.textContent = state.direction === 1 ? "↑" : "↓";
      } else {
        th.removeAttribute("aria-sort");
        icon.textContent = "↕";
      }
    }
    state.page = 1;
    renderTable();
  }

  function detailButton(row, className, label, field) {
    const button = make("button", className, label);
    button.type = "button";
    button.setAttribute("aria-haspopup", "dialog");
    const hotel = get(row, "D") || get(row, "A");
    const subject = field ? columnFor(field).label.replaceAll("\n", "") : "详情";
    button.setAttribute("aria-label", `查看 ${hotel} 的${subject}`);
    button.addEventListener("click", () => showDetails(row, field));
    return button;
  }

  function renderTable() {
    const { results, pageSize: size } = state;
    const pages = Math.ceil(results.length / size);
    state.page = Math.min(Math.max(1, pages), state.page);
    const start = (state.page - 1) * size;
    const visible = results.slice(start, start + size);
    const fragment = document.createDocumentFragment();
    for (const row of visible) {
      const tr = make("tr");
      for (const column of shownColumns) {
        const { key, numeric: isNumeric, type } = column;
        const raw = get(row, key);
        const value = formatValue(raw, column, true);
        const td = make("td", `column-${key.toLowerCase()}`);
        if (isNumeric) td.classList.add("cell-number");
        if (key === "A" || key === "D") {
          const buttonClass = key === "A" ? "code-button" : "hotel-button";
          td.append(detailButton(row, buttonClass, value));
        } else if (type === "long" && typeof raw === "string" && raw.trim()) {
          const button = detailButton(row, "progress-button", undefined, key);
          button.append(make("span", "progress-preview", raw.trim()), make("span", "progress-link", "查看全文"));
          td.append(button);
        } else {
          td.textContent = value;
        }
        tr.append(td);
      }
      fragment.append(tr);
    }
    if (!visible.length) {
      const tr = make("tr");
      const empty = make("td", "empty", "没有符合条件的项目，请调整搜索或筛选。");
      empty.colSpan = shownColumns.length;
      tr.append(empty);
      fragment.append(tr);
    }
    tableBody.replaceChildren(fragment);
    tableScroll.scrollTop = 0;
    updateHorizontalControls();
    byId("page-label").textContent = pages ? `第 ${state.page} / ${pages} 页` : "0 页";
    prev.disabled = state.page <= 1;
    next.disabled = state.page >= pages;
  }

  function showDetails(row, focusKey) {
    byId("details-title").textContent = get(row, "D") || "酒店项目";
    byId("details-code").textContent = get(row, "A") || "";
    const fragment = document.createDocumentFragment();
    let focusItem;
    for (const group of detailGroups) {
      const section = make("section", "detail-section");
      const list = make("dl", "detail-list");
      for (let index = group.start; index < group.end; index += 1) {
        const column = columns[index];
        const item = make("div", column.type === "long" ? "wide" : null);
        item.append(make("dt", null, column.label), make("dd", null, formatValue(row[index], column)));
        if (column.key === focusKey) focusItem = item;
        list.append(item);
      }
      section.append(make("h3", null, group.label), list);
      fragment.append(section);
    }
    byId("detail-body").replaceChildren(fragment);
    details.showModal();
    details.scrollTop = 0;
    if (focusItem) focusItem.scrollIntoView({ block: "start" });
  }

  function csvCell(value) {
    let text = String(value ?? "");
    // Quote formula-like text so spreadsheet apps open it as a literal value.
    if (typeof value === "string" && /^[\u0000-\u0020]*(?:[=+@＝＋＠－]|-.+)/u.test(value)) {
      text = `'${text}`;
    }
    return `"${text.replaceAll('"', '""')}"`;
  }

  function download(blob, fileName, status) {
    const url = URL.createObjectURL(blob);
    const link = make("a");
    link.href = url;
    link.download = fileName;
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    byId("download-status").textContent = status;
  }

  csvButton.addEventListener("click", () => {
    const header = columns.map(({ label }) => csvCell(label)).join(",");
    const data = state.results.map(row => row.map(csvCell).join(","));
    const csv = `\uFEFF${[header, ...data].join("\r\n")}\r\n`;
    download(new Blob([csv], { type: "text/csv;charset=utf-8" }), "酒店筹建明细-筛选结果.csv", `已开始下载 ${data.length} 个项目的 CSV`);
  });

  byId("export-xlsx").addEventListener("click", () => {
    const raw = atob(byId("excel-bytes").textContent.trim());
    const bytes = Uint8Array.from(raw, letter => letter.charCodeAt(0));
    const blob = new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    download(blob, "酒店筹建明细.xlsx", "已开始下载全量 Excel");
  });

  search.addEventListener("input", updateFilters);
  region.addEventListener("change", updateFilters);
  brand.addEventListener("change", updateFilters);
  reset.addEventListener("click", () => {
    search.value = region.value = brand.value = "";
    updateFilters();
    search.focus();
  });
  pageSize.addEventListener("change", () => {
    state.pageSize = Number(pageSize.value);
    state.page = 1;
    renderTable();
  });
  prev.addEventListener("click", () => { state.page -= 1; renderTable(); });
  next.addEventListener("click", () => { state.page += 1; renderTable(); });
  function updateHorizontalControls() {
    const overflow = tableScroll.scrollWidth - tableScroll.clientWidth;
    const remaining = overflow - tableScroll.scrollLeft;
    horizontalControls.hidden = overflow <= 1;
    scrollLeft.disabled = tableScroll.scrollLeft <= 1;
    scrollRight.disabled = remaining <= 1;
  }
  function moveTable(direction) {
    tableScroll.scrollBy({ left: direction * Math.max(175, tableScroll.clientWidth - 165) });
  }
  tableScroll.addEventListener("scroll", updateHorizontalControls, { passive: true });
  window.addEventListener("resize", updateHorizontalControls);
  scrollLeft.addEventListener("click", () => moveTable(-1));
  scrollRight.addEventListener("click", () => moveTable(1));

  function showCurrentSection() {
    const section = location.hash === "#projects" ? "#projects" : "#overview";
    for (const link of document.querySelectorAll(".topbar nav a")) {
      if (link.hash === section) link.setAttribute("aria-current", "location");
      else link.removeAttribute("aria-current");
    }
  }
  window.addEventListener("hashchange", showCurrentSection);

  byId("source-name").textContent = source;
  byId("footer-source").textContent = `${source} · ${sheet}`;
  renderOverview();
  createTableHeader();
  setupFieldChooser();
  showCurrentSection();
  updateFilters();
})();
</script>
</body>
</html>
